<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Profile Mascot Jump</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f8fbff;
    font-family: system-ui, sans-serif;
  }
  .mascot {
    width: min(420px, 80vw);
    height: auto;
    transform-origin: 50% 92%;
    animation: mascot-hop 2.4s cubic-bezier(.22,.8,.3,1) infinite;
    will-change: transform;
  }
  @keyframes mascot-hop {
    0%, 10%, 100% { transform: translateY(0) scaleX(1) scaleY(1); }
    18% { transform: translateY(2px) scaleX(1.015) scaleY(.985); }
    34% { transform: translateY(-16px) scaleX(.99) scaleY(1.01); }
    50% { transform: translateY(0) scaleX(1.012) scaleY(.988); }
    62% { transform: translateY(-3px) scaleX(.998) scaleY(1.002); }
    72% { transform: translateY(0) scaleX(1) scaleY(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mascot { animation: none; }
  }
</style>
</head>
<body>
  <img class="mascot" src="dreamy_pearl_orb_ai_mascot.png" alt="AI Profile mascot">
</body>
</html>
